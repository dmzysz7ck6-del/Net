[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-knowledge"
version = "0.1.0"
description = "Is the migration network the knowledge network? Migrant stocks, scholarly mobility and co-authorship as three network layers"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "statsmodels>=0.14", "networkx>=3.2",
  "scikit-learn>=1.4", "matplotlib>=3.8", "plotly>=5.20", "requests>=2.31", "openpyxl>=3.1",
  "xlrd>=2.0", "pyyaml>=6.0", "country_converter>=1.2", "tabulate>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
