[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ossnet"
version = "0.1.0"
description = "Network-science health checks for open-source communities, from git history"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["networkx>=3.2", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ossnet = "ossnet.cli:main"

[tool.setuptools]
packages = ["ossnet"]

[tool.setuptools.package-data]
ossnet = ["report.css", "report.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
